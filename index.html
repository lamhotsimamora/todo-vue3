<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 Todo List</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>

<body>

    <br>
    <div id="app" class="container">

        <div class="card">
            <div class="card-header">
                Todo List Vue 3 App {{developer}}
            </div>
            <div class="card-content p-2">
                <input @keyup.enter="save" class="form-control" v-model="todo" ref="todo" type="text" placeholder="Todo (Press Enter to Submit)">
                <br><br>
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Todo</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="data in todo_list" :key="data.id">
                            <td>{{data.todo}}</td>
                            <td>
                                <button @click="deleteData(data.id)" class="btn btn-danger btn xs" type="button">x</button>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
            <div class="card-footer">
                Copyright@2025-Deratek
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>


    <script>
        function randomString(l) {
            l = (l === undefined) ? l = 10 : l;
            var r = '',
                c = '1234567890';
            for (var i = 0; i < l; i++) {
                r += c.charAt(Math.floor(Math.random() * c.length))
            }
            return r
        }

        const app = Vue.createApp({
            data() {
                return {
                    todo_list: [],
                    todo: null,
                    developer: 'Lamhot Simamora'
                }
            },
            methods: {
                deleteData(id) {
                    var tmp = []

                    var todo_list = this.todo_list
                    todo_list.forEach(e => {
                        if (e['id'] === id) {

                        } else {
                            tmp.push({
                                'id': e['id'],
                                'todo': e['todo']
                            })
                        }
                    });
                    this.todo_list = tmp
                },
                save() {
                    if (this.todo == null) {
                        this.$refs.todo.focus();
                        return;
                    }
                    this.todo_list.push({
                        'id': randomString(),
                        'todo': this.todo
                    })
                    this.todo = null
                }
            },
            mounted() {

            }
        }).mount('#app')
    </script>
</body>

</html>
